<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text: #334155;
            --heading: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 4px;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .app-header {
            background: #ffffff;
            padding: 10px 12px 8px 12px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .app-title {
            font-size: 0.92rem;
            color: var(--heading);
            font-weight: 700;
        }

        .app-subtitle {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .version-badge {
            display: inline-block;
            background: #f1f5f9;
            color: #0f766e;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            border: 1px solid #e2e8f0;
        }

        .form-container {
            padding: 10px 14px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-bottom: 5px;
        }

        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                align-items: center;
                gap: 8px;
                margin-bottom: 5px;
            }
            label {
                width: 160px;
                flex-shrink: 0;
                text-align: right;
            }
        }

        label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--heading);
        }

        input, select {
            width: 100%;
            flex: 1;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.78rem;
            color: #1e3a8a;
            font-weight: 700;
            background: var(--input-bg);
            transition: all 0.2s ease;
        }

        input[type="file"] {
            padding: 4px;
            font-size: 0.72rem;
            color: var(--muted);
            background: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.75rem;
        }

        .pro-box {
            display: none;
            background: #f0fdf4;
            border: 1px dashed #0d9488;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            margin-bottom: 6px;
            text-align: center;
        }

        .pro-box.active {
            display: block;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.2);
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="wrapper" id="appWrapper">
    <div class="app-header">
        <div class="app-title">✨ Tu Tarjeta de Presentación Digital</div>
        <div class="app-subtitle">Ingresa tus datos para elaborar tu tarjeta</div>
        <div class="version-badge" id="versionTag">Versión: Cargando...</div>
    </div>

    <div class="form-container">
        <!-- Importante: enctype="multipart/form-data" es necesario para que FormSubmit reciba archivos -->
        <form id="tarjetaForm" enctype="multipart/form-data">
            
            <input type="hidden" id="dynamicSubject" name="_subject" value="Solicitud Tarjeta Digital">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <!-- Campos ocultos para inyectar los códigos profesionales completos -->
            <input type="hidden" id="vcfGenerated" name="CODIGO_VCF_PARA_GITHUB" value="">
            <input type="hidden" id="htmlGenerated" name="CODIGO_INDEX_HTML_PARA_GITHUB" value="">

            <!-- Selección de Plan (Arriba) -->
            <div class="form-row">
                <label>Selecciona tu Plan</label>
                <select id="tipoPlan" name="Plan Seleccionado" onchange="togglePlanFields()">
                    <option value="Base ($9.900 - Sin logo, con/sin emoji)">Plan Base ($9.900) - Sin logo, con/sin emoji</option>
                    <option value="Pro ($14.990 - Con logo o fotografía)">Plan Pro ($14.990) - Con Logo o Fotografía</option>
                </select>
            </div>

            <div class="form-row">
                <label>Nombre completo</label>
                <input type="text" id="nombre" name="Nombre Completo" placeholder="Ej: Marlene Encina Vega" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Empresa o emprendimiento</label>
                <input type="text" id="empresa" name="Empresa o Emprendimiento" placeholder="Ej: Servicios Profesionales" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Cargo o función</label>
                <input type="text" id="cargo" name="Cargo o Función" placeholder="Ej: Consultora" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Título profesional u oficio</label>
                <input type="text" id="titulo" name="Título Profesional u Oficio" enterkeyhint="next" placeholder="Ej: Técnico en Informática">
            </div>

            <div class="form-row">
                <label>Dirección completa</label>
                <input type="text" id="direccion" name="Dirección Completa" enterkeyhint="next" placeholder="Ej: Pasaje Los Aromas 450 (Opcional)">
            </div>

            <div class="form-row">
                <label>Ciudad</label>
                <input type="text" id="ciudad" name="Ciudad" placeholder="Ej: Talca" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Número celular (sin +56)</label>
                <input type="tel" id="celular" name="Número Celular" placeholder="Ej: 995797206" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Correo electrónico</label>
                <input type="email" id="correo" name="Correo Electrónico" placeholder="Ej: marlenencina@hotmail.com" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Página web</label>
                <input type="text" id="web" name="Página Web" enterkeyhint="next" placeholder="Ej: https://miemprendimiento.cl (Opcional)">
            </div>

            <div class="form-row">
                <label>Red social principal</label>
                <input type="text" id="redsocial" name="Red Social Principal" placeholder="Ej: https://www.facebook.com/marlene" enterkeyhint="done" required>
            </div>

            <!-- Campo Condicional Plan Base: Emoji -->
            <div class="form-row" id="rowEmoji">
                <label>Emoji de preferencia (Opcional)</label>
                <input type="text" id="emoji" name="Emoji de Preferencia" placeholder="Ej: 💻, 🌿, 📁" maxlength="10" enterkeyhint="done">
            </div>

            <!-- Cajetín de carga de archivo para Plan Pro (Al Final) -->
            <div id="rowProInfo" class="pro-box">
                <p style="font-size: 0.7rem; color: #166534; margin-bottom: 4px; font-weight: 500;">
                    <b>Plan Pro:</b> Adjunta tu logotipo o fotografía aquí:
                </p>
                <div class="form-row" style="margin-bottom: 0;">
                    <label style="width: auto;">Archivo de Logo:</label>
                    <input type="file" id="logotipo" name="Logotipo_Cliente" accept="image/*">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">📩 Enviar Solicitud</button>
        </form>
    </div>
</div>

<script>
    const ahoraInit = new Date();
    const diaInit = String(ahoraInit.getDate()).padStart(2, '0');
    const mesInit = String(ahoraInit.getMonth() + 1).padStart(2, '0');
    const anioInit = ahoraInit.getFullYear();
    const horaInit24 = ahoraInit.toTimeString().split(' ')[0].substring(0, 5);
    document.getElementById('versionTag').textContent = `Versión: ${diaInit}/${mesInit}/${anioInit} - ${horaInit24}`;

    function togglePlanFields() {
        const plan = document.getElementById('tipoPlan').value;
        const rowEmoji = document.getElementById('rowEmoji');
        const rowProInfo = document.getElementById('rowProInfo');

        if (plan.includes('Pro')) {
            rowEmoji.style.display = 'none';
            rowProInfo.classList.add('active');
        } else {
            rowEmoji.style.display = 'flex';
            rowProInfo.classList.remove('active');
        }
    }

    const form = document.getElementById('tarjetaForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.textContent = "Enviando solicitud y archivo...";
        btn.disabled = true;

        const nombreVal = document.getElementById('nombre').value.trim();
        const empresaVal = document.getElementById('empresa').value.trim();
        const cargoVal = document.getElementById('cargo').value.trim();
        const tituloVal = document.getElementById('titulo').value.trim();
        const direccionVal = document.getElementById('direccion').value.trim();
        const ciudadVal = document.getElementById('ciudad').value.trim();
        const celularVal = document.getElementById('celular').value.trim();
        const correoVal = document.getElementById('correo').value.trim();
        const webVal = document.getElementById('web').value.trim();
        const redsocialVal = document.getElementById('redsocial').value.trim();

        const ahora = new Date();
        const dia = String(ahora.getDate()).padStart(2, '0');
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const anio = ahora.getFullYear();
        const fechaLatam = `${dia}/${mes}/${anio}`;
        const hora24 = ahora.toTimeString().split(' ')[0].substring(0, 5);
        
        document.getElementById('dynamicSubject').value = `Solicitud Tarjeta: ${nombreVal} - ${fechaLatam} ${hora24}`;

        const vcfContent = 
`BEGIN:VCARD
VERSION:3.0
FN:${nombreVal}
ORG:${empresaVal}
TITLE:${cargoVal}
TEL;TYPE=CELL:+56${celularVal}
EMAIL:${correoVal}
${direccionVal ? `ADR;TYPE=WORK:;;${direccionVal};${ciudadVal};;Chile` : `ADR;TYPE=WORK:;;;${ciudadVal};;;Chile`}
${webVal ? `URL:${webVal}` : `URL:${redsocialVal}`}
END:VCARD`;

        document.getElementById('vcfGenerated').value = vcfContent;

        const htmlContent = 
`<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${nombreVal} - Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --heading: #0f172a;
            --muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { width: 100%; max-width: 400px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); padding: 30px 20px; text-align: center; border: 1px solid #e2e8f0; }
        .avatar { width: 90px; height: 90px; background: #e2e8f0; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary); font-weight: 700; }
        h1 { font-size: 1.4rem; color: var(--heading); margin-bottom: 4px; }
        h2 { font-size: 0.95rem; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
        .company { font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
        ${tituloVal ? `.titulo { font-size: 0.8rem; background: #f1f5f9; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; color: var(--text); }` : ''}
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s; }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(13, 148, 136, 0.2); }
        .btn-secondary { background: #f1f5f9; color: var(--primary); border: 1px solid #cbd5e1; }
        .btn:hover { opacity: 0.9; }
        .info-list { text-align: left; margin: 20px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; padding: 15px 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .info-item { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">${nombreVal.charAt(0)}</div>
        <h1>${nombreVal}</h1>
        <h2>${cargoVal}</h2>
        <div class="company">${empresaVal}</div>
        ${tituloVal ? `<div class="titulo">${tituloVal}</div>` : ''}
        
        <div class="info-list">
            <a href="tel:+56${celularVal}" class="info-item">📞 +56 ${celularVal}</a>
            <a href="mailto:${correoVal}" class="info-item">✉️ ${correoVal}</a>
            ${direccionVal ? `<div class="info-item">📍 ${direccionVal}, ${ciudadVal}</div>` : `<div class="info-item">📍 ${ciudadVal}, Chile</div>`}
            ${webVal ? `<a href="${webVal}" target="_blank" class="info-item">🌐 Sitio Web Oficial</a>` : ''}
            <a href="${redsocialVal}" target="_blank" class="info-item">🔗 Red Social Principal</a>
        </div>

        <div class="actions">
            <a href="contacto.vcf" class="btn btn-primary" download>💾 Guardar Contacto</a>
            <a href="tel:+56${celularVal}" class="btn btn-secondary">📞 Llamar Ahora</a>
        </div>
    </div>
</body>
</html>`;

        document.getElementById('htmlGenerated').value = htmlContent;

        const formData = new FormData(form);
        
        fetch("https://formsubmit.co/ajax/marketingmaule@gmail.com", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('appWrapper').innerHTML = `
                <div style="padding: 40px 20px; text-align: center;">
                    <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
                    <h2 style="color: #0f172a; font-size: 1.2rem; margin-bottom: 8px;">¡Solicitud enviada con éxito!</h2>
                    <p style="color: #64748b; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px;">
                        Tus datos y archivo adjunto han sido enviados correctamente a Marketing Maule.<br>
                        Nos pondremos en contacto contigo a la brevedad para entregarte tu tarjeta digital.
                    </p>
                    <a href="https://marketingmaule.github.io/solicitud-tarjeta-digital/" style="color: #0d9488; text-decoration: none; font-weight: 600; font-size: 0.9rem;">← Enviar otra solicitud</a>
                </div>
            `;
        })
        .catch(error => {
            alert("Hubo un error al enviar. Por favor intenta nuevamente.");
            btn.textContent = "📩 Enviar Solicitud";
            btn.disabled = false;
        });
    });

    const formInputs = document.querySelectorAll('form input:not([type="hidden"]):not([type="file"])');
    formInputs.forEach((input, index) => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < formInputs.length - 1) {
                    formInputs[index + 1].focus();
                } else {
                    document.getElementById('submitBtn').click();
                }
            }
        });
    });
</script>

</body>
</html>
