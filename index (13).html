<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text: #334155;
            --heading: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 4px;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .app-header {
            background: #ffffff;
            padding: 10px 12px 8px 12px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .app-title {
            font-size: 0.92rem;
            color: var(--heading);
            font-weight: 700;
        }

        .app-subtitle {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .version-badge {
            display: inline-block;
            background: #f1f5f9;
            color: #0f766e;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            border: 1px solid #e2e8f0;
        }

        .form-container {
            padding: 10px 14px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-bottom: 5px;
        }

        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                align-items: center;
                gap: 8px;
                margin-bottom: 5px;
            }
            label {
                width: 160px;
                flex-shrink: 0;
                text-align: right;
            }
        }

        label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--heading);
        }

        input, select {
            width: 100%;
            flex: 1;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.78rem;
            color: #1e3a8a;
            font-weight: 700;
            background: var(--input-bg);
            transition: all 0.2s ease;
        }

        input[type="file"] {
            padding: 4px;
            font-size: 0.72rem;
            color: var(--muted);
            background: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.75rem;
        }

        .section-title {
            text-align: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: #0f766e;
            margin: 8px 0 6px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
        }

        .pro-box {
            display: none;
            background: #f0fdf4;
            border: 1px dashed #0d9488;
            padding: 8px;
            border-radius: 6px;
            margin-top: 6px;
            margin-bottom: 6px;
            text-align: center;
        }

        .pro-box.active {
            display: block;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.2);

            background: var(--accent-hover);
        }

</head>

<script>
    const ahoraInit = new Date();
    const diaInit = String(ahoraInit.getDate()).padStart(2, '0');
    const mesInit = String(ahoraInit.getMonth() + 1).padStart(2, '0');
    const anioInit = ahoraInit.getFullYear();

    function togglePlanFields() {
        const plan = document.getElementById('tipoPlan').value;

        if (plan.includes('Pro')) {

            rowEmoji.style.display = 'flex';
            rowProInfo.classList.remove('active');
        }
    }

    // URL de tu implementación de Apps Script (termina en /exec)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzuRVp-3JyRzxHU5dRzgc3jWCjVKo9QTfSoPn6WtxgnoZi0t7DjWpOxBxdDIqzZAv28tA/exec';

    // ---------- Utilidades ----------
    function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escAttr(s) {
        return esc(s).replace(/\n/g, '&#10;');
    }
    function soloDigitosCelular(n) {
        let d = String(n).replace(/\D/g, '');
        if (d.length === 11 && d.startsWith('56')) d = d.slice(2);
        return d;
    }
    function formatoCelular(d) {
        if (d.length === 9) return '+56 ' + d[0] + ' ' + d.slice(1, 5) + ' ' + d.slice(5);
        return '+56 ' + d;
    }
    // Acepta "facebook.com/pamelaxxx", "www.sitio.cl" o con https:// y completa lo que falta
    function normUrl(u) {
        u = String(u || '').trim();
        if (!u) return '';
        if (/^https?:\/\//i.test(u)) return u;
        return 'https://' + u.replace(/^\/+/, '');
    }
    function hostDe(u) {
        try { return new URL(u).hostname; } catch (e) { return u; }
    }
    function etiquetaRed(u) {
        const h = hostDe(u).toLowerCase();
        if (h.includes('linkedin')) return 'LinkedIn';
        if (h.includes('facebook') || h.includes('fb.com')) return 'Facebook';
        if (h.includes('instagram')) return 'Instagram';
        if (h.includes('tiktok')) return 'TikTok';
        if (h.includes('youtube') || h.includes('youtu.be')) return 'YouTube';
        if (h.includes('twitter') || h === 'x.com' || h.endsWith('.x.com')) return 'X';
        if (h.includes('wa.me') || h.includes('whatsapp')) return 'WhatsApp';
        return 'Red Social';
    }
    function extensionLogo(file) {
        const porNombre = (file.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        if (porNombre && porNombre.length <= 5 && file.name.includes('.')) return porNombre;
        const porTipo = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/gif': 'gif', 'image/svg+xml': 'svg' };
        return porTipo[file.type] || 'png';
    }
    // "Pamela Vega Encina" -> "pamela_vega" (para nombrar los archivos del cliente)
    function slugNombre(n) {
        const partes = String(n).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
            .replace(/[^a-z0-9\s]/g, ' ').trim().split(/\s+/).filter(Boolean);
        return partes.slice(0, 2).join('_') || 'cliente';
    }
    function leerBlob(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result).split(',')[1]);
            reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
            reader.readAsDataURL(blob);
        });
    }
    // Reduce fotos pesadas de celular (máx. 900 px, JPG) para que la tarjeta cargue rápido
    function comprimirFoto(file) {
        return new Promise(resolve => {
            const original = { blob: file, ext: null };
            if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(original);
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                try {
                    const factor = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
                    const w = Math.round(img.naturalWidth * factor);
                    const h = Math.round(img.naturalHeight * factor);
                    const cv = document.createElement('canvas');
                    cv.width = w; cv.height = h;
                    const cx = cv.getContext('2d');
                    cx.fillStyle = '#ffffff';
                    cx.fillRect(0, 0, w, h);
                    cx.drawImage(img, 0, 0, w, h);
                    cv.toBlob(b => {
                        URL.revokeObjectURL(url);
                        resolve(b && b.size < file.size ? { blob: b, ext: 'jpg' } : original);
                    }, 'image/jpeg', 0.88);
                } catch (e) { URL.revokeObjectURL(url); resolve(original); }
            };
            img.onerror = () => { URL.revokeObjectURL(url); resolve(original); };
            img.src = url;
        });
    }

    const CARD_JS = `
(function () {
  function ajustar() {

    // Escapa los caracteres especiales del formato vCard (coma, punto y coma, barra)
    function vcfEsc(t) {
        return String(t || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
    }
    // "Pedro Ramírez Pinto" -> apellidos "Ramírez Pinto" y nombres "Pedro" (campo N del vCard)
    function partirNombre(nombre) {
        const partes = String(nombre).trim().split(/\s+/).filter(Boolean);
        if (partes.length <= 1) return { apellidos: '', nombres: partes[0] || '' };
        const particulas = ['de', 'del', 'la', 'las', 'los', 'san', 'santa', 'y', 'van', 'von'];
        const cuantos = partes.length >= 3 ? 2 : 1;
        const fam = [];
        let i = partes.length - 1;
        for (let k = 0; k < cuantos && i > 0; k++) {
            fam.unshift(partes[i]); i--;
            while (i > 0 && particulas.includes(partes[i].toLowerCase())) { fam.unshift(partes[i]); i--; }
        }
        return { apellidos: fam.join(' '), nombres: partes.slice(0, i + 1).join(' ') };
    }

    function construirVcf(d) {
        const n = partirNombre(d.nombre);
        // N es obligatorio en vCard 3.0: sin él el iPhone muestra la empresa como nombre del contacto
        const l = ['BEGIN:VCARD', 'VERSION:3.0',
            'N:' + vcfEsc(n.apellidos) + ';' + vcfEsc(n.nombres) + ';;;',
            'FN:' + vcfEsc(d.nombre)];
        if (d.empresa) l.push('ORG:' + vcfEsc(d.empresa));
        if (d.cargo) l.push('TITLE:' + vcfEsc(d.cargo));
        l.push('TEL;TYPE=CELL:+56' + d.tel);
        l.push('EMAIL:' + d.correo);
        if (d.direccion || d.ciudad) l.push('ADR;TYPE=WORK:;;' + vcfEsc(d.direccion) + ';' + vcfEsc(d.ciudad) + ';;;Chile');
        if (d.web) l.push('URL:' + d.web);
        if (d.red) l.push('URL:' + d.red);
        l.push('END:VCARD');
        return l.join('\n');
