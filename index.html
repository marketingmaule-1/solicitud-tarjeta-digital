<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text: #334155;
            --heading: #0f172a;
            --muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 4px;
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.9);
        }

        .app-header {
            background: #ffffff;
            padding: 10px 12px 8px 12px;
            text-align: center;
            border-bottom: 1px solid #f1f5f9;
        }

        .app-title {
            font-size: 0.92rem;
            color: var(--heading);
            font-weight: 700;
        }

        .app-subtitle {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .version-badge {
            display: inline-block;
            background: #f1f5f9;
            color: #0f766e;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            border: 1px solid #e2e8f0;
        }

        .form-container {
            padding: 10px 14px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-bottom: 5px;
        }

        @media (min-width: 480px) {
            .form-row {
                flex-direction: row;
                align-items: center;
                gap: 8px;
                margin-bottom: 5px;
            }
            label {
                width: 160px;
                flex-shrink: 0;
                text-align: right;
            }
        }

        label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--heading);
        }

        input, select {
            width: 100%;
            flex: 1;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.78rem;
            color: #1e3a8a;
            font-weight: 700;
            background: var(--input-bg);
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.75rem;
        }

        .file-upload-box {
            display: none;
            background: #f8fafc;
            border: 1px dashed var(--accent);
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 5px;
            text-align: center;
        }

        .file-upload-box.active {
            display: block;
        }

        .file-upload-box input {
            font-size: 0.7rem;
            font-weight: 400;
            border: none;
            background: transparent;
        }

        .submit-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(13, 148, 136, 0.2);
        }

        .submit-btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="wrapper" id="appWrapper">
    <div class="app-header">
        <div class="app-title">✨ Tu Tarjeta de Presentación Digital</div>
        <div class="app-subtitle">Selecciona tu plan e ingresa tus datos</div>
        <div class="version-badge" id="versionTag">Versión: Cargando...</div>
    </div>

    <div class="form-container">
        <!-- Formulario configurado con Web3Forms -->
        <form id="tarjetaForm">
            
            <!-- ACCESS KEY DE WEB3FORMS (Vinculado a marketingmaule@gmail.com) -->
            <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
            
            <input type="hidden" id="dynamicSubject" name="subject" value="Solicitud Tarjeta Digital">
            <input type="hidden" name="from_name" value="Marketing Maule Tarjetas">

            <!-- Campos ocultos para inyectar los códigos -->
            <input type="hidden" id="vcfGenerated" name="CODIGO_VCF_PARA_GITHUB" value="">
            <input type="hidden" id="htmlGenerated" name="CODIGO_INDEX_HTML_PARA_GITHUB" value="">

            <div class="form-row">
                <label>Selecciona tu Plan</label>
                <select id="tipoPlan" name="Plan Seleccionado" onchange="togglePlanFields()">
                    <option value="Base ($9.900 - Sin logo, con/sin emoji)">Plan Base ($9.900) - Sin logo, con/sin emoji</option>
                    <option value="Pro ($14.990 - Con logo o fotografía)">Plan Pro ($14.990) - Con Logo o Fotografía</option>
                </select>
            </div>

            <div class="form-row">
                <label>Nombre completo</label>
                <input type="text" id="nombre" name="Nombre Completo" placeholder="Ej: Marlene [Apellido]" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Empresa o emprendimiento</label>
                <input type="text" id="empresa" name="Empresa o Emprendimiento" placeholder="Ej: Fundas y Cojines" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Cargo o función</label>
                <input type="text" id="cargo" name="Cargo o Función" placeholder="Ej: Directora Creativa" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Título profesional u oficio</label>
                <input type="text" id="titulo" name="Título Profesional u Oficio" enterkeyhint="next" placeholder="Ej: Diseñadora, Especialista">
            </div>

            <div class="form-row">
                <label>Dirección completa</label>
                <input type="text" id="direccion" name="Dirección Completa" enterkeyhint="next" placeholder="Ej: Pasaje Los Aromas 450 (Opcional)">
            </div>

            <div class="form-row">
                <label>Ciudad</label>
                <input type="text" id="ciudad" name="Ciudad" placeholder="Ej: Talca" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Número celular (sin +56)</label>
                <input type="tel" id="celular" name="Número Celular" placeholder="Ej: 987654321" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Correo electrónico</label>
                <input type="email" id="correo" name="Correo Electrónico" placeholder="Ej: marlene@correo.cl" enterkeyhint="next" required>
            </div>

            <div class="form-row">
                <label>Página web</label>
                <input type="text" id="web" name="Página Web" enterkeyhint="next" placeholder="Ej: https://miemprendimiento.cl (Opcional)">
            </div>

            <div class="form-row">
                <label>Red social principal</label>
                <input type="text" id="redsocial" name="Red Social Principal" placeholder="Ej: https://www.instagram.com/marlene" enterkeyhint="next" required>
            </div>

            <!-- Campo Condicional Plan Base: Emoji -->
            <div class="form-row" id="rowEmoji">
                <label>Emoji de preferencia (Opcional)</label>
                <input type="text" id="emoji" name="Emoji de Preferencia" placeholder="Ej: 🧵, 🛋️, 🌿" maxlength="10" enterkeyhint="done">
            </div>

            <!-- Plan Pro: Subir Archivo de Logo/Foto -->
            <div id="rowArchivo" class="file-upload-box">
                <label style="display:block; text-align:center; font-size:0.7rem; margin-bottom:3px; color:#0d9488;">Adjunta tu Logo o Fotografía (Plan Pro)</label>
                <input type="file" id="logoFile" name="attachment" accept="image/*">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">📩 Enviar Solicitud</button>
        </form>
    </div>
</div>

<script>
    // Formato de fecha y hora latinoamericano (dd/mm/aaaa) y 24 horas
    const ahoraInit = new Date();
    const optionsFecha = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    document.getElementById('versionTag').textContent = `Versión: ${ahoraInit.toLocaleString('es-CL', optionsFecha)}`;

    function togglePlanFields() {
        const plan = document.getElementById('tipoPlan').value;
        const rowEmoji = document.getElementById('rowEmoji');
        const rowArchivo = document.getElementById('rowArchivo');

        if (plan.includes('Pro')) {
            rowEmoji.style.display = 'none';
            rowArchivo.classList.add('active');
        } else {
            rowEmoji.style.display = 'flex';
            rowArchivo.classList.remove('active');
        }
    }

    const form = document.getElementById('tarjetaForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        btn.textContent = "Enviando solicitud...";
        btn.disabled = true;

        const planVal = document.getElementById('tipoPlan').value;
        const emojiVal = document.getElementById('emoji').value.trim() || '👤';
        const nombreVal = document.getElementById('nombre').value.trim();
        const empresaVal = document.getElementById('empresa').value.trim();
        const cargoVal = document.getElementById('cargo').value.trim();
        const tituloVal = document.getElementById('titulo').value.trim();
        const direccionVal = document.getElementById('direccion').value.trim();
        const ciudadVal = document.getElementById('ciudad').value.trim();
        const celularVal = document.getElementById('celular').value.trim();
        const correoVal = document.getElementById('correo').value.trim();
        const webVal = document.getElementById('web').value.trim();
        const redsocialVal = document.getElementById('redsocial').value.trim();

        // Generar fecha (dd/mm/aaaa) y hora en formato 24 horas exactas para el asunto
        const ahora = new Date();
        const dia = String(ahora.getDate()).padStart(2, '0');
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const anio = ahora.getFullYear();
        const fechaLatam = `${dia}/${mes}/${anio}`;
        const hora24 = ahora.toTimeString().split(' ')[0].substring(0, 5); // Ej: 23:45

        // Asunto estructurado con formato latinoamericano y hora 24h
        document.getElementById('dynamicSubject').value = `Solicitud (${planVal.split(' ')[0]}): ${nombreVal} - ${fechaLatam} ${hora24}`;

        // VCF Completo
        const vcfContent = 
`BEGIN:VCARD
VERSION:3.0
FN:${nombreVal}
ORG:${empresaVal}
TITLE:${cargoVal}
TEL;TYPE=CELL:+56${celularVal}
EMAIL:${correoVal}
${direccionVal ? `ADR;TYPE=WORK:;;${direccionVal};${ciudadVal};;Chile` : `ADR;TYPE=WORK:;;;${ciudadVal};;;Chile`}
${webVal ? `URL:${webVal}` : `URL:${redsocialVal}`}
END:VCARD`;

        document.getElementById('vcfGenerated').value = vcfContent;

        // INDEX.HTML Estándar
        const htmlContent = 
`<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${nombreVal} - Tarjeta Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #0284c7;
            --whatsapp-color: #25d366;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #334155;
            --muted-color: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); padding: 28px 20px; text-align: center; border: 1px solid #e2e8f0; }
        .avatar-emoji { font-size: 3.5rem; margin-bottom: 10px; display: inline-block; background: #f8fafc; width: 90px; height: 90px; line-height: 90px; border-radius: 50%; border: 1px solid #e2e8f0; }
        h1 { font-size: 1.35rem; color: #0f172a; font-weight: 700; margin-bottom: 4px; }
        h2 { font-size: 0.95rem; color: var(--accent-color); font-weight: 600; margin-bottom: 4px; }
        .company { font-size: 0.85rem; color: var(--muted-color); margin-bottom: 15px; }
        ${tituloVal ? `.titulo-badge { font-size: 0.78rem; background: #f1f5f9; color: #475569; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; font-weight: 500; }` : ''}
        
        .main-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; margin-bottom: 15px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: transform 0.1s, opacity 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-vcf { background: #1e293b; color: #ffffff; }
        .btn-ws { background: var(--whatsapp-color); color: #ffffff; }
        
        .grid-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-sub { background: #f8fafc; color: #334155; border: 1px solid #e2e8f0; font-size: 0.82rem; padding: 10px; }
        
        .qr-section { margin-top: 20px; border-top: 1px solid #f1f5f9; padding-top: 18px; }
        .qr-title { font-size: 0.7rem; font-weight: 700; color: #94a3b8; letter-spacing: 0.05em; margin-bottom: 10px; text-transform: uppercase; }
        .qr-img { width: 130px; height: 130px; border-radius: 10px; border: 1px solid #e2e8f0; padding: 5px; background: #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar-emoji">${emojiVal}</div>
        <h1>${nombreVal}</h1>
        <h2>${cargoVal}</h2>
        <div class="company">${empresaVal} • ${ciudadVal}</div>
        ${tituloVal ? `<div class="titulo-badge">${tituloVal}</div>` : ''}

        <div class="main-actions">
            <a href="contacto.vcf" class="btn btn-vcf" download>💾 Guardar en Contactos</a>
            <a href="https://wa.me/56${celularVal}?text=Hola%20${encodeURIComponent(nombreVal)},%20vi%20tu%20tarjeta%20digital." target="_blank" class="btn btn-ws">💬 Mensaje por WhatsApp</a>
        </div>

        <div class="grid-actions">
            <a href="tel:+56${celularVal}" class="btn btn-sub">📞 Llamar</a>
            <a href="mailto:${correoVal}" class="btn btn-sub">✉️ Correo</a>
            ${webVal ? `<a href="${webVal}" target="_blank" class="btn btn-sub">🌐 Sitio Web</a>` : ''}
            <a href="${redsocialVal}" target="_blank" class="btn btn-sub">🔗 Red Social</a>
        </div>

        <div class="qr-section">
            <div class="qr-title">Escanear para compartir</div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://marketingmaule.github.io/${encodeURIComponent(nombreVal.toLowerCase().replace(/\s+/g, '-'))}/" alt="Código QR" class="qr-img">
        </div>
    </div>
</body>
</html>`;

        document.getElementById('htmlGenerated').value = htmlContent;

        // Envío por Web3Forms mediante fetch (permite adjuntos y mantiene al usuario en la misma pantalla)
        const formData = new FormData(form);

        fetch("https://api.web3forms.com/submit", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('appWrapper').innerHTML = `
                    <div style="padding: 40px 20px; text-align: center;">
                        <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
                        <h2 style="color: #0f172a; font-size: 1.2rem; margin-bottom: 8px;">¡Solicitud enviada con éxito!</h2>
                        <p style="color: #64748b; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px;">
                            Tus datos, archivo adjunto y códigos han sido recibidos correctamente.<br>
                            Nos pondremos en contacto contigo a la brevedad.
                        </p>
                        <a href="https://marketingmaule.github.io/solicitud-tarjeta-digital/" style="color: #0d9488; text-decoration: none; font-weight: 600; font-size: 0.9rem;">← Enviar otra solicitud</a>
                    </div>
                `;
            } else {
                alert("Error al enviar: " + data.message);
                btn.textContent = "📩 Enviar Solicitud";
                btn.disabled = false;
            }
        })
        .catch(error => {
            alert("Hubo un error de red. Por favor intenta nuevamente.");
            btn.textContent = "📩 Enviar Solicitud";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
